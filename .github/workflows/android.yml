name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Extraction Setup
      run: python3 scripts/setup.py --no-build

    - name: Generate Missing Gradle Wrapper
      run: |
        cd platform/mobile/android
        gradle wrapper

    # Step A: Tells the build manager to target both the core application and SDL3 together
    - name: Patch App Build Target Configuration
      run: |
        sed -i "s/'daytona'/'daytona_app', 'SDL3-shared'/g" platform/mobile/android/app/build.gradle

    - name: Grant Execute Permission to Gradle
      run: chmod +x platform/mobile/android/gradlew

    # Step B: Runs the actual compilation to create the framework elements
    - name: Compile APK Framework
      run: |
        cd platform/mobile/android
        ./gradlew assembleDebug --no-daemon

    # Step C: Safety-first file finder that renames libdaytona_app.so to libmain.so wherever it is hidden
    - name: Find and Rename Built Library
      run: |
        find platform/mobile/android/app/build/ -name "libdaytona_app.so" -exec dir="" {} \; -exec sh -c 'cp "$1" "$(dirname "$1")/libmain.so"' _ {} \;

    # Step D: Finalize bundle compression with our newly aligned binary structure
    - name: Repack Finalized Android Package
      run: |
        cd platform/mobile/android
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Daytona-Android-APK
        path: platform/mobile/android/app/build/outputs/apk/debug/app-debug.apk
