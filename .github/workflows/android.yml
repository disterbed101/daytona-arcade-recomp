name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Extraction Setup
      run: python3 scripts/setup.py --no-build

    - name: Generate Missing Gradle Wrapper
      run: |
        cd platform/mobile/android
        gradle wrapper

    # Patches the broken hardcoded target configuration inside the source code
    - name: Patch Native Build Targets
      run: |
        sed -i 's/android.nativeBuildTargets=daytona/android.nativeBuildTargets=daytona_app/g' platform/mobile/android/gradle.properties

    - name: Grant Execute Permission to Gradle
      run: chmod +x platform/mobile/android/gradlew

    - name: Compile APK with Gradle
      run: |
        cd platform/mobile/android
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Daytona-Android-APK
        path: platform/mobile/android/app/build/outputs/apk/debug/app-debug.apk
