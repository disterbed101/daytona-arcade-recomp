name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Extraction Setup
      run: python3 scripts/setup.py --no-build

    # FIX 1: Configures the app module to build both targets
    - name: Configure Android Native Targets
      run: |
        sed -i "s/'daytona'/'daytona_app', 'SDL3-shared'/g" platform/mobile/android/app/build.gradle

    # FIX 2: Forces CMake to rename the output binary to 'main' so the Java activity can find it
 
    - name: Force 64-Bit ABI Packaging
      run: |
        sed -i "/ndk {/a \            abiFilters 'arm64-v8a'" platform/mobile/android/app/build.gradle

    - name: Initialize Gradle Wrapper Files
      run: |
        cd platform/mobile/android
        gradle wrapper

    - name: Grant Execute Permission to Gradle
      run: chmod +x platform/mobile/android/gradlew

    - name: Compile and Pack Finalized APK
      run: |
        cd platform/mobile/android
        ./gradlew assembleDebug --no-daemon

    - name: Inspect APK Native Libraries
      run: |
        echo "=== Libraries packaged inside APK ==="
        unzip -l platform/mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep '\.so' || true

        echo "=== Native libraries produced by CMake ==="
        find platform/mobile/android/app/.cxx -type f -name '*.so' -print

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Daytona-Android-APK
        path: platform/mobile/android/app/build/outputs/apk/debug/app-debug.apk
