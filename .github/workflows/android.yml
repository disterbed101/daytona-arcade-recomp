name: Build Android APK

on:
  workflow_dispatch: # Allows you to manually start the build with a button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Runs the project setup without requiring physical ROMs for the skeleton build
    - name: Run Extraction Setup
      run: python3 scripts/setup.py --no-build

    - name: Grant Execute Permission to Gradle
      run: chmod +x platform/mobile/android/gradlew

    - name: Compile APK with Gradle
      run: |
        cd platform/mobile/android
        ./gradlew :app:assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Daytona-Android-APK
        path: platform/mobile/android/app/build/outputs/apk/debug/app-debug.apk
