name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Extraction Setup
      run: python3 scripts/setup.py --no-build

    - name: Generate Missing Gradle Wrapper
      run: |
        cd platform/mobile/android
        gradle wrapper

    # Sets up the target application configurations to bundle SDL3 and the app modules together
    - name: Patch App Build Target Configuration
      run: |
        sed -i "s/'daytona'/'daytona_app', 'SDL3-shared'/g" platform/mobile/android/app/build.gradle

    # Patches Gradle to automatically clone and name the C++ binary as libmain.so during assembly tasks
    - name: Inject Automated Binary Naming Rule
      run: |
        sed -i "/buildTypes {/i \    applicationVariants.all { variant -> variant.outputs.all { output -> output.processResourcesProvider.get().doLast { exec { commandLine 'ln', '-sf', 'libdaytona_app.so', \"\${project.buildDir}/intermediates/merged_native_libs/\${variant.name}/merge\${variant.name.capitalize()}NativeLibs/out/lib/arm64-v8a/libmain.so\" } } } }" platform/mobile/android/app/build.gradle

    - name: Grant Execute Permission to Gradle
      run: chmod +x platform/mobile/android/gradlew

    # Compiles everything seamlessly on the first attempt with the fixed internal architecture names
    - name: Compile Finalized APK Container
      run: |
        cd platform/mobile/android
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Daytona-Android-APK
        path: platform/mobile/android/app/build/outputs/apk/debug/app-debug.apk
